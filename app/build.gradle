plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.walkguard'
    compileSdk 34

    defaultConfig {
        applicationId "jp.walkguard"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // 署名鍵の設定は keystore.properties（リポジトリには入れない）から読む。
    // 同じ鍵で署名し続けると、履歴を消さずに上書き更新できる。
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // keystore.properties が無いときは、署名なしのAPKになる
            signingConfig ksFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
